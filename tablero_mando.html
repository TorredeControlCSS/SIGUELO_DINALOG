<!--
  TABLERO DE MANDO DE LA DIRECCIÓN · Panel ejecutivo · v1 · 01-oct-2026
  Lee SOLO archivos estáticos publicados en GitHub Pages. No llama a ningún Apps Script.
  1. registro_fuentes.json (este repo): fuentes, metas e instrumentos de los 11 indicadores.
  2. Cada fuente del registro: kpi_inventario.json, kanban/kpi_kanban.json,
     entradas_recepcion.json (#5 se calcula aquí), redistribucion_cedis.json (#8 y decisiones),
     kpi_manual.json (#4).
  3. renglones_dic.json (marca VITAL) para la franja "Requieren su decisión".
  Las metas se cambian en registro_fuentes.json, nunca en este archivo.
-->
<style>

.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:12px}

.bars .mt{position:absolute;left:0;right:0;border-top:2px dashed #1c1c1c}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.8fr);gap:10px;align-items:stretch}
.two .pn .bars{flex:1;min-height:170px;height:auto}
table.t th.so{cursor:pointer;user-select:none}table.t th.so:hover{background:var(--az2)}
table.t th .ar{font-size:9px;opacity:.85;margin-left:4px}
#mapaUE{height:380px;border:1px solid var(--bd)}
.mleg{display:flex;gap:10px;font-size:11px;align-items:center;flex-wrap:wrap}.mleg i{display:inline-block;width:14px;height:10px;margin-right:4px;vertical-align:middle}
.card.go{cursor:pointer}.card.go:hover{outline:2px solid var(--az2)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1c1c;color:#fff;padding:10px 16px;font-size:13px;display:none;z-index:60;max-width:90vw}
.load{padding:40px;text-align:center;font-size:14px;color:var(--tx2)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gh,.lcell{grid-column:1/-1!important}.grp{grid-column:1/-1!important}.cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}.dec{grid-template-columns:1fr}}
@media print{nav,.acts,.q{display:none}body{background:#fff}}
</style>

<script>
(function(){
'use strict';
var REG_URL = 'registro_fuentes.json';
var DIC_URL = 'https://torredecontrolcss.github.io/REPOSICION_UE_CSS/renglones_dic.json';
var LOGO = 'https://raw.githubusercontent.com/TorredeControlCSS/REPOSICION_UE_CSS/main/icons/icon-192.png';
var MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var OBJ = { '01':'Objetivo 01 · Disponibilidad del insumo', '02':'Objetivo 02 · Presupuesto y proveedores', '03':'Objetivo 03 · Productividad', '04':'Objetivo 04 · Gobernanza' };
var ORDEN = { '01':['1a','1b','9','2','3'], '02':['4','5','6'], '03':['7','8'], '04':['10'] };
var DEF = {
  '1a':['Pedidos (Formas 8) despachados dentro de su fecha de entrega.','Despachos a tiempo ÷ despachos elegibles del mes. Laboratorio se cuenta aparte.','Cada publicación del Kanban'],
  '1b':['Pedidos despachados con el 100% de lo solicitado.','Despachos completos ÷ despachos elegibles del mes. Incluye los faltantes por desabasto.','Cada publicación del Kanban'],
  '9':['Qué parte de la cantidad solicitada por las unidades ejecutoras se asignó.','Unidades asignadas ÷ unidades solicitadas en el mes.','Cada publicación del Kanban'],
  '2':['Renglones agotados en CEDIS Panamá.','Renglones en estado AGOTADO (inventario proyectado en cero o menos) ÷ renglones del Reporte de Abastecimiento.','Cada corte de inventario'],
  '3':['Cuántos meses alcanza el inventario de CEDIS Panamá al ritmo de consumo.','Mediana de los meses de cobertura de los renglones con demanda.','Cada corte de inventario'],
  '4':['Presupuesto ejecutado sobre el presupuesto modificado.','(Devengado + pagado) ÷ presupuesto modificado, según el GR55 de SAP-SAFIRO. Hoy es una cifra preliminar: el GR55 de julio que se presentó en el Plan. No sale del Kardex. Se actualizará cuando Finanzas comparta sus datos.','Carga manual mensual'],
  '5':['Entregas de proveedores recibidas dentro de su fecha de entrega.','Entregas a tiempo ÷ entregas comparables, por mes de recepción.','Cada carga de recepción'],
  '6':['Días que tarda el ciclo de atención de un pedido.','Mediana de días del ciclo de los pedidos del mes, según el Kanban. Aún no separa pedido mensual y urgencia.','Cada publicación del Kanban'],
  '7':['Formas 8 que salen del almacén por día hábil.','Salidas del mes ÷ días hábiles transcurridos.','Cada publicación del Kanban'],
  '8':['Traslados que llevarían un renglón a un CEDIS que hoy está en cero.','Traslados sugeridos hacia un CEDIS en cero (Redistribución entre CEDIS).','Cada carga de saldos'],
  '10':['Valor del inventario de CEDIS Panamá que vence en los próximos 90 días.','Valor de lotes que vencen en 0 a 90 días ÷ valor total. Misma regla del Reporte de Vencimientos: excluye vencidos e incumple FMD.','Cada corte de inventario']
};
var COL = { ok:['#3f9a4a','#1d5a27','#eef7ee'], bajo:['#d99a2b','#7a4a00','#fdf3e3'], crit:['#c83a3a','#9b1c1c','#fbeaea'], con:['#b8b8b8','#5a5a5a','#f2f2f2'] };
var BAND = { R:'#e3a5a5', A:'#f0cf8f', G:'#a9d4a9', X:'#dadada' };

var S = { reg:null, src:{}, est:{}, ind:{}, meses:[], idx:0, cards:{}, timer:null, dic:null, red:null };

function $(id){ return document.getElementById(id); }
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(function(){ t.style.display='none'; },4200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hoyPTY(){ var d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Panama'})); d.setHours(0,0,0,0); return d; }
function fISO(s){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function fCorta(s){ var d=fISO(s); return d ? (d.getDate()+'-'+MES[d.getMonth()].toLowerCase()) : ''; }
function diasHabiles(desde, hasta){ var n=0, d=new Date(desde); d.setDate(d.getDate()+1); while(d<=hasta){ var w=d.getDay(); if(w>=1&&w<=5) n++; d.setDate(d.getDate()+1); } return n; }
function fmt(x,u){ if(x==null||isNaN(x)) return '—'; var r=Math.round(x*100)/100; var s=Math.abs(r)>=100?Math.round(r).toLocaleString('en-US'):String(r); return s+(u==='%'?'%':(u?' '+u:'')); }
function uGap(u){ return u==='%'?'pts':u; }
/* Distancia a la meta en el sentido en que debe moverse: subir o bajar. */
function textoGap(g,v){
  var gap=g.dir==='up'?g.meta-v:v-g.meta;
  if(gap<=0) return 'En meta · margen '+fmt(-gap,uGap(g.unidad));
  return (g.dir==='up'?'Debe subir ':'Debe bajar ')+fmt(gap,uGap(g.unidad))+' para llegar a la meta';
}

function cargar(url){

  function uno(){ return fetch(u,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
  return uno().catch(function(){ return new Promise(function(res){ setTimeout(res,1500); }).then(uno); });
}

/* ── Serie mensual de cada indicador: { 'YYYY-MM': {v, corte, vacio} } ── */
function serieKpi(j, id){
  var out={}, h=(j&&j.historico)||{};

  return out;
}
function prepararIndicadores(){
  var I={}, src=S.src;

  ['2','3','10'].forEach(function(id){ if(inv) I[id]={ serie:serieKpi(inv,id), det:(inv.indicadores[id]||{}).detalle, fuente:'inventario', corte:inv.corte, foto:true }; });
  ['1a','1b','9','6','7'].forEach(function(id){
    if(!kan) return;
    var s=serieKpi(kan,id);
    Object.keys(s).forEach(function(m){ if(!s[m].salidas) s[m].vacio=true; });
    I[id]={ serie:s, det:(kan.indicadores[id]||{}).detalle, fuente:'kanban', corte:kan.corte, flujo:'salidas', mesDet:kan.mes, hist:kan.historico||{} };
  });
  if(man) I['4']={ serie:serieKpi(man,'4'), det:'Cifra preliminar: GR55 de julio presentado en el Plan. Pendiente de los datos de Finanzas.', fuente:'manual', corte:man.corte, arrastre:true };
  var ent=src.recepcion;
  if(ent && ent.rows){
    var pm={}, ta=0, tt=0;
    ent.rows.forEach(function(x){ if(!x.cumpl) return; var m=x.periodo; if(!pm[m]) pm[m]=[0,0]; pm[m][1]++; tt++; if(x.cumpl==='A TIEMPO'){ pm[m][0]++; ta++; } });
    var s={}, corte=(ent._meta&&ent._meta.corte)||'';
    Object.keys(pm).forEach(function(m){ s[m]={ v:Math.round(1000*pm[m][0]/pm[m][1])/10, corte:(corte.substring(0,7)===m?corte:m+'-cierre') }; });
    I['5']={ serie:s, det:'Acumulado del año: '+(tt?Math.round(1000*ta/tt)/10:'—')+'% ('+ta.toLocaleString('en-US')+' de '+tt.toLocaleString('en-US')+' entregas)', fuente:'recepcion', corte:corte, flujo:'entregas de proveedores registradas' };
  }
  var red=src.redistribucion;
  if(red && red.kpi){
    var c=red.kpi.corte||''; var s8={}; s8[c.substring(0,7)]={ v:red.kpi.destinosEnCero, corte:c };
    I['8']={ serie:s8, det:red.kpi.renglonesTraslado.toLocaleString('en-US')+' renglones en traslado · '+red.kpi.totalTraslados.toLocaleString('en-US')+' traslados sugeridos', fuente:'redistribucion', corte:c, foto:true };
  }

}
function valorEn(id, mes){
  var I=S.ind[id]; if(!I) return null;
  var f=I.serie[mes];
  if(f) return { v:f.v, corte:f.corte, vacio:!!f.vacio };
  if(I.foto && mes===S.mesHoy){ var kf=Object.keys(I.serie).filter(function(m){ return m<=mes; }).sort(); if(kf.length){ var q=I.serie[kf[kf.length-1]]; return { v:q.v, corte:q.corte }; } }
  if(I.flujo && mes===S.mesHoy) return { v:null, vacio:true };
  if(I.arrastre){ var ks=Object.keys(I.serie).filter(function(m){ return m<=mes; }).sort(); if(ks.length){ var k=ks[ks.length-1]; if(mesesEntre(k,mes)>3) return null; return { v:I.serie[k].v, corte:I.serie[k].corte, arrastre:k }; } }
  return null;
}
function mesesEntre(a,b){ return (+b.substring(0,4)-+a.substring(0,4))*12+(+b.substring(5,7)-+a.substring(5,7)); }
function mesAnt(m){ var y=+m.substring(0,4), n=+m.substring(5,7)-1; if(n<1){ n=12; y--; } return y+'-'+(n<10?'0':'')+n; }
function mesLabel(m){ return MES[+m.substring(5,7)-1]+' '+m.substring(0,4); }

/* ── Estado de cada fuente ── */
function evaluarFuentes(){
  var hoy=hoyPTY(), html=[], mayor='';
  S.reg.fuentes.forEach(function(f){
    var j=S.src[f.id], e={ ok:!!j };
    if(j){
      var ref = f.id==='kanban' ? String(j.generado||'').substring(0,10)
              : f.id==='recepcion' ? ((j._meta&&j._meta.corte)||'')
              : f.id==='redistribucion' ? ((j.kpi&&j.kpi.corte)||'')
              : (j.corte||'');
      var d=fISO(ref); e.ref=ref; e.dh = d ? diasHabiles(d,hoy) : 99; e.stale = e.dh > f.diasHabilesMax;
      var g='';

}

/* ── Instrumentos ── */
var CX=80, CY=82, R=60;
function pt(f,rr){ var t=Math.PI*(1-f); return [(CX+rr*Math.cos(t)).toFixed(1),(CY-rr*Math.sin(t)).toFixed(1)]; }
function arc(f1,f2){ var a=pt(f1,R), b=pt(f2,R); return 'M '+a[0]+' '+a[1]+' A '+R+' '+R+' 0 0 1 '+b[0]+' '+b[1]; }
function cl(x){ return Math.max(0,Math.min(1,x)); }
function bandas(g){ var b1=cl((g.dir==='up'?0.8*g.meta:g.meta)/g.max), b2=cl((g.dir==='up'?g.meta:1.25*g.meta)/g.max); return [b1,b2]; }
function svgGauge(id,g){
  var b=bandas(g), fm=cl(g.meta/g.max), m1=pt(fm,R-12), m2=pt(fm,R+10);
  var lo=g.instrumento==='fuel'?'Vacío':'0', hi=g.instrumento==='fuel'?'Lleno':fmt(g.max,g.unidad);
  return '<svg width="160" height="100" viewBox="0 0 160 100" aria-label="Velocímetro">'+
    '<path id="a1_'+id+'" d="'+arc(0,b[0])+'" fill="none" stroke-width="14"/>'+
    '<path id="a2_'+id+'" d="'+arc(b[0],b[1])+'" fill="none" stroke-width="14"/>'+
    '<path id="a3_'+id+'" d="'+arc(b[1],1)+'" fill="none" stroke-width="14"/>'+
    '<line x1="'+m1[0]+'" y1="'+m1[1]+'" x2="'+m2[0]+'" y2="'+m2[1]+'" stroke="#1c1c1c" stroke-width="3"/>'+
    '<g class="needle" id="nd_'+id+'" style="transform-origin:80px 82px;transform:rotate(-90deg)"><line x1="80" y1="82" x2="80" y2="30" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/></g>'+
    '<circle cx="80" cy="82" r="6" fill="#1c1c1c"/>'+
    '<text x="16" y="98" font-size="10" fill="#4a4a4a" text-anchor="middle">'+esc(lo)+'</text>'+
    '<text x="144" y="98" font-size="10" fill="#4a4a4a" text-anchor="middle">'+esc(hi)+'</text></svg>';
}
function htmlThermo(id,g){
  return '<div class="thermo"><div style="display:flex;flex-direction:column;align-items:center"><div class="tube"><div class="fill" id="tf_'+id+'" style="height:0"></div><div class="mk" style="bottom:'+(cl(g.meta/g.max)*100)+'%"></div></div><div class="bulb" id="tb_'+id+'"></div></div><div class="tsc"><span style="bottom:'+(26+cl(g.meta/g.max)*74-6)+'px">Meta '+(g.dir==='up'?'≥ ':'≤ ')+esc(fmt(g.meta,g.unidad))+'</span></div></div>';

/* ── Franja de decisiones: renglones VITALES con un CEDIS en cero y traslado posible ── */
function decisiones(){
  var red=S.src.redistribucion, dic=S.dic;
  if(!red||!red.f) return '<div class="lbl"><b>Requieren su decisión</b><span>Fuente de alertas no disponible</span></div>';
  var vit=function(c){ return dic && dic.r && dic.r[c] && dic.r[c].vit===1; };
  var G={};
  red.f.forEach(function(x){ if(!(x.urgente && x.destinoEnCero && (dic ? vit(x.cod) : true))) return;
    var k=x.cod+'|'+x.destino; if(!G[k]) G[k]={ cod:x.cod, renglon:x.renglon, destino:x.destino, consumo:x.consumoDestino||0, mover:0, origenes:[] };
    G[k].mover+=Number(x.mover)||0; if(G[k].origenes.indexOf(x.origen)<0) G[k].origenes.push(x.origen); });
  var L=Object.keys(G).map(function(k){ return G[k]; });
  L.sort(function(a,b){ return b.consumo-a.consumo; }); S.vitales=L;
  var top=L.slice(0,3).map(function(x){
    var nom=String(x.renglon||x.cod).split(',')[0];
    return '<a class="dc" href="#plan" data-go="plan" title="'+esc(x.renglon)+'"><div class="n">Hoy</div><div class="t"><b>'+esc(nom)+'</b><span>'+esc(x.destino)+' en cero · mover '+x.mover.toLocaleString('en-US')+' u desde '+esc(x.origenes.join(' y '))+'</span></div></a>';
  }).join('');
  while((top.match(/class="dc"/g)||[]).length<3) top+='<div></div>';
  return '<div class="lbl"><b>Requieren su decisión</b><span>'+L.length.toLocaleString('en-US')+' casos: renglones vitales en cero en un CEDIS · corte '+esc(fCorta(red.kpi&&red.kpi.corte))+'</span></div>'+top+
    '<a class="all" href="#plan" data-go="plan">Ver todas →</a>';
}

function estado(g,v){
  if(v==null) return 'con';
  var good=g.dir==='up'?v>=g.meta:v<=g.meta; if(good) return 'ok';
  var near=g.dir==='up'?v>=0.8*g.meta:v<=1.25*g.meta; return near?'bajo':'crit';
}
function odo(id,v,u){
  var w=$('ow_'+id); if(!w) return;
  var s = v==null ? '--' : (Math.round(v*10)/10).toFixed(v%1?1:0).padStart(u==='d'?2:4,'0');
  var sig=s.replace(/\d/g,'9');
  if(w.dataset.sig!==sig){ w.dataset.sig=sig;
    var cols=w.dataset.cols||''; w.innerHTML=s.split('').map(function(ch){ return /\d/.test(ch)?'<div class="d"><div>'+cols+'</div></div>':'<div class="p">'+esc(ch)+'</div>'; }).join('');
  }
  s.split('').forEach(function(ch,i){ var n=w.childNodes[i]; if(n && n.firstChild && /\d/.test(ch)) n.firstChild.style.transform='translateY(-'+(+ch*30)+'px)'; });
}
function pintar(i){
  S.idx=i; var mes=S.meses[i], ant=mesAnt(mes);

  Object.keys(S.reg.indicadores).forEach(function(id){

    hr.height=30; ws.autoFilter={from:{row:f,column:1},to:{row:f,column:nC}};
    filas.forEach(function(rw,j){ var row=ws.getRow(f+1+j); rw.forEach(function(v,i){ var x=row.getCell(i+1), tp=cols[i].t||'txt';
      x.value=(v===''||v==null)?null:(tp==='txt'?String(v):(isFinite(v)?Number(v):String(v)));
      if(tp==='num') x.numFmt='#,##0'; if(tp==='dec') x.numFmt='0.0#'; x.font={name:tp==='txt'?'Calibri':'Consolas',size:10};
      if(j%2) x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF4F7FB'}}; }); });
    cols.forEach(function(c,i){ ws.getColumn(i+1).width=c.w||14; });
    return wb.xlsx.writeBuffer();
  }).then(function(buf){
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=nombre+'_'+sello().substring(0,10)+'.xlsx'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); toast('Excel descargado.');
  }).catch(function(e){ toast(e.message); });
}
