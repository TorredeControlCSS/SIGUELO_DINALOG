<!--
  TABLERO DE MANDO DE LA DIRECCIÓN · Panel ejecutivo · v1 · 01-oct-2026
  Lee SOLO archivos estáticos publicados en GitHub Pages. No llama a ningún Apps Script.
  1. registro_fuentes.json (este repo): fuentes, metas e instrumentos de los 11 indicadores.
  2. Cada fuente del registro: kpi_inventario.json, kanban/kpi_kanban.json,
     entradas_recepcion.json (#5 se calcula aquí), redistribucion_cedis.json (#8 y decisiones),
     kpi_manual.json (#4).
  3. renglones_dic.json (marca VITAL) para la franja "Requieren su decisión".
  Las metas se cambian en registro_fuentes.json, nunca en este archivo.
-->

<body>
<header>
  <img src="https://raw.githubusercontent.com/TorredeControlCSS/REPOSICION_UE_CSS/main/icons/icon-192.png" alt="Logo CSS" crossorigin="anonymous">
  <div class="ht"><h1>Tablero de Mando de la Dirección</h1><div>Dirección Nacional de Logística · CEDIS Panamá · Indicadores del Plan Estratégico</div></div>
  <div class="hr">
    <div class="stamp" id="stamp">Cargando fuentes…</div>
    <div class="acts">
      <button class="yv" id="bYarvis" type="button" title="Disponible en la siguiente fase">💬 Consultar a YARVIS ↗</button>

<script>
(function(){

};
var COL = { ok:['#3f9a4a','#1d5a27','#eef7ee'], bajo:['#d99a2b','#7a4a00','#fdf3e3'], crit:['#c83a3a','#9b1c1c','#fbeaea'], con:['#b8b8b8','#5a5a5a','#f2f2f2'] };

function $(id){ return document.getElementById(id); }
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(function(){ t.style.display='none'; },4200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hoyPTY(){ var d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Panama'})); d.setHours(0,0,0,0); return d; }
function fISO(s){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function fCorta(s){ var d=fISO(s); return d ? (d.getDate()+'-'+MES[d.getMonth()].toLowerCase()) : ''; }
function diasHabiles(desde, hasta){ var n=0, d=new Date(desde); d.setDate(d.getDate()+1); while(d<=hasta){ var w=d.getDay(); if(w>=1&&w<=5) n++; d.setDate(d.getDate()+1); } return n; }
function fmt(x,u){ if(x==null||isNaN(x)) return '—'; var r=Math.round(x*100)/100; var s=Math.abs(r)>=100?Math.round(r).toLocaleString('en-US'):String(r); return s+(u==='%'?'%':(u?' '+u:'')); }
function uGap(u){ return u==='%'?'pts':u; }
/* Distancia a la meta en el sentido en que debe moverse: subir o bajar. */
function textoGap(g,v){
  var gap=g.dir==='up'?g.meta-v:v-g.meta;
  if(gap<=0) return 'En meta · margen '+fmt(-gap,uGap(g.unidad));
  return (g.dir==='up'?'Debe subir ':'Debe bajar ')+fmt(gap,uGap(g.unidad))+' para llegar a la meta';
}

function cargar(url){
  var u = url + (url.indexOf('?')<0?'?':'&') + 't=' + Date.now();
  function uno(){ return fetch(u,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
  return uno().catch(function(){ return new Promise(function(res){ setTimeout(res,1500); }).then(uno); });
}

/* ── Serie mensual de cada indicador: { 'YYYY-MM': {v, corte, vacio} } ── */
function serieKpi(j, id){
  var out={}, h=(j&&j.historico)||{};
  Object.keys(h).forEach(function(m){ var f=h[m]; if(f && f[id]!==undefined) out[m]={ v:f[id], corte:f.corte, salidas:f.salidas }; });
  return out;
}
function prepararIndicadores(){
  var I={}, src=S.src;
  var inv=src.inventario, kan=src.kanban, man=src.manual;
  ['2','3','10'].forEach(function(id){ if(inv) I[id]={ serie:serieKpi(inv,id), det:(inv.indicadores[id]||{}).detalle, fuente:'inventario', corte:inv.corte, foto:true }; });
  ['1a','1b','9','6','7'].forEach(function(id){
    if(!kan) return;
    var s=serieKpi(kan,id);
    Object.keys(s).forEach(function(m){ if(!s[m].salidas) s[m].vacio=true; });
    I[id]={ serie:s, det:(kan.indicadores[id]||{}).detalle, fuente:'kanban', corte:kan.corte, flujo:'salidas', mesDet:kan.mes, hist:kan.historico||{} };
  });
  if(man) I['4']={ serie:serieKpi(man,'4'), det:'Cifra preliminar: GR55 de julio presentado en el Plan. Pendiente de los datos de Finanzas.', fuente:'manual', corte:man.corte, arrastre:true };
  var ent=src.recepcion;
  if(ent && ent.rows){
    var pm={}, ta=0, tt=0;
    ent.rows.forEach(function(x){ if(!x.cumpl) return; var m=x.periodo; if(!pm[m]) pm[m]=[0,0]; pm[m][1]++; tt++; if(x.cumpl==='A TIEMPO'){ pm[m][0]++; ta++; } });
    var s={}, corte=(ent._meta&&ent._meta.corte)||'';
    Object.keys(pm).forEach(function(m){ s[m]={ v:Math.round(1000*pm[m][0]/pm[m][1])/10, corte:(corte.substring(0,7)===m?corte:m+'-cierre') }; });
    I['5']={ serie:s, det:'Acumulado del año: '+(tt?Math.round(1000*ta/tt)/10:'—')+'% ('+ta.toLocaleString('en-US')+' de '+tt.toLocaleString('en-US')+' entregas)', fuente:'recepcion', corte:corte, flujo:'entregas de proveedores registradas' };
  }
  var red=src.redistribucion;
  if(red && red.kpi){
    var c=red.kpi.corte||''; var s8={}; s8[c.substring(0,7)]={ v:red.kpi.destinosEnCero, corte:c };
    I['8']={ serie:s8, det:red.kpi.renglonesTraslado.toLocaleString('en-US')+' renglones en traslado · '+red.kpi.totalTraslados.toLocaleString('en-US')+' traslados sugeridos', fuente:'redistribucion', corte:c, foto:true };
  }
  S.ind=I;
}
function valorEn(id, mes){
  var I=S.ind[id]; if(!I) return null;
  var f=I.serie[mes];
  if(f) return { v:f.v, corte:f.corte, vacio:!!f.vacio };
  if(I.foto && mes===S.mesHoy){ var kf=Object.keys(I.serie).filter(function(m){ return m<=mes; }).sort(); if(kf.length){ var q=I.serie[kf[kf.length-1]]; return { v:q.v, corte:q.corte }; } }
  if(I.flujo && mes===S.mesHoy) return { v:null, vacio:true };
  if(I.arrastre){ var ks=Object.keys(I.serie).filter(function(m){ return m<=mes; }).sort(); if(ks.length){ var k=ks[ks.length-1]; if(mesesEntre(k,mes)>3) return null; return { v:I.serie[k].v, corte:I.serie[k].corte, arrastre:k }; } }
  return null;
}
function mesesEntre(a,b){ return (+b.substring(0,4)-+a.substring(0,4))*12+(+b.substring(5,7)-+a.substring(5,7)); }
function mesAnt(m){ var y=+m.substring(0,4), n=+m.substring(5,7)-1; if(n<1){ n=12; y--; } return y+'-'+(n<10?'0':'')+n; }
function mesLabel(m){ return MES[+m.substring(5,7)-1]+' '+m.substring(0,4); }

/* ── Estado de cada fuente ── */
function evaluarFuentes(){
  var hoy=hoyPTY(), html=[], mayor='';
  S.reg.fuentes.forEach(function(f){
    var j=S.src[f.id], e={ ok:!!j };
    if(j){
      var ref = f.id==='kanban' ? String(j.generado||'').substring(0,10)
              : f.id==='recepcion' ? ((j._meta&&j._meta.corte)||'')
              : f.id==='transitos' ? String((j._meta&&j._meta.generado)||'').substring(0,10)
              : f.id==='redistribucion' ? ((j.kpi&&j.kpi.corte)||'')
              : (j.corte||'');
      var d=fISO(ref); e.ref=ref; e.dh = d ? diasHabiles(d,hoy) : 99; e.stale = e.dh > f.diasHabilesMax;
      var g='';
      if(f.id==='redistribucion' && j.generado){ g=new Date(j.generado).toLocaleString('sv-SE',{timeZone:'America/Panama'}); }
      else if(f.id==='recepcion'){ g=(j._meta&&j._meta.generado)||''; }
      else if(f.id==='transitos'){ g=String((j._meta&&j._meta.generado)||'').replace(' PTY',''); }
      else if(f.tipo!=='manual'){ g=String(j.generado||''); }
      g=String(g).substring(0,16);
      if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(g) && g>mayor) mayor=g;
    }
    S.est[f.id]=e;
    var chip = !e.ok ? '<span class="chip c-er">No disponible</span>' : e.stale ? '<span class="chip c-st">Desactualizada</span>' : '<span class="chip c-ok">Al día</span>';
    html.push('<span><b>'+esc(f.nombre)+'</b> · corte '+esc(e.ok?fCorta(e.ref):'—')+chip+'</span>');
  });
  S.srcHtml=html.join('');
  S.mayor=mayor;
}

/* ── Instrumentos ── */
var CX=80, CY=82, R=60;
function pt(f,rr){ var t=Math.PI*(1-f); return [(CX+rr*Math.cos(t)).toFixed(1),(CY-rr*Math.sin(t)).toFixed(1)]; }
function arc(f1,f2){ var a=pt(f1,R), b=pt(f2,R); return 'M '+a[0]+' '+a[1]+' A '+R+' '+R+' 0 0 1 '+b[0]+' '+b[1]; }
function cl(x){ return Math.max(0,Math.min(1,x)); }
function bandas(g){ var b1=cl((g.dir==='up'?0.8*g.meta:g.meta)/g.max), b2=cl((g.dir==='up'?g.meta:1.25*g.meta)/g.max); return [b1,b2]; }
function svgGauge(id,g){
  var b=bandas(g), fm=cl(g.meta/g.max), m1=pt(fm,R-12), m2=pt(fm,R+10);
  var lo=g.instrumento==='fuel'?'Vacío':'0', hi=g.instrumento==='fuel'?'Lleno':fmt(g.max,g.unidad);
  return '<svg width="160" height="100" viewBox="0 0 160 100" aria-label="Velocímetro">'+
    '<path id="a1_'+id+'" d="'+arc(0,b[0])+'" fill="none" stroke-width="14"/>'+
    '<path id="a2_'+id+'" d="'+arc(b[0],b[1])+'" fill="none" stroke-width="14"/>'+
    '<path id="a3_'+id+'" d="'+arc(b[1],1)+'" fill="none" stroke-width="14"/>'+
    '<line x1="'+m1[0]+'" y1="'+m1[1]+'" x2="'+m2[0]+'" y2="'+m2[1]+'" stroke="#1c1c1c" stroke-width="3"/>'+
    '<g class="needle" id="nd_'+id+'" style="transform-origin:80px 82px;transform:rotate(-90deg)"><line x1="80" y1="82" x2="80" y2="30" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/></g>'+
    '<circle cx="80" cy="82" r="6" fill="#1c1c1c"/>'+
    '<text x="16" y="98" font-size="10" fill="#4a4a4a" text-anchor="middle">'+esc(lo)+'</text>'+
    '<text x="144" y="98" font-size="10" fill="#4a4a4a" text-anchor="middle">'+esc(hi)+'</text></svg>';
}
function htmlThermo(id,g){
  return '<div class="thermo"><div style="display:flex;flex-direction:column;align-items:center"><div class="tube"><div class="fill" id="tf_'+id+'" style="height:0"></div><div class="mk" style="bottom:'+(cl(g.meta/g.max)*100)+'%"></div></div><div class="bulb" id="tb_'+id+'"></div></div><div class="tsc"><span style="bottom:'+(26+cl(g.meta/g.max)*74-6)+'px">Meta '+(g.dir==='up'?'≥ ':'≤ ')+esc(fmt(g.meta,g.unidad))+'</span></div></div>';
}
function htmlOdo(id,g){

  return '<div class="odo"><div class="win" id="ow_'+id+'" data-cols="'+esc(cols)+'"></div><div class="u">'+esc(g.unidad)+'</div></div>';
}
function card(id){
  var g=S.reg.indicadores[id];
  var ins = (g.instrumento==='gauge'||g.instrumento==='fuel') ? svgGauge(id,g) : g.instrumento==='thermo' ? htmlThermo(id,g) : htmlOdo(id,g);
  return '<div class="card go" id="cd_'+id+'" title="Ver el detalle"><div class="hd"><div class="lamp" id="lp_'+id+'"></div><div class="nm">'+esc(id+' · '+g.nombre)+'</div><button class="q" type="button" data-q="'+id+'" aria-label="Qué mide este indicador">?</button></div>'+
    '<div class="ins">'+ins+'</div>'+
    '<div class="vr"><div class="val" id="vl_'+id+'">—</div><div class="fec" id="fc_'+id+'"></div></div>'+
    '<div class="mt">Meta '+(g.dir==='up'?'≥ ':'≤ ')+esc(fmt(g.meta,g.unidad))+(g.notaMeta?' · provisional':'')+'</div>'+
    '<div class="gap" id="gp_'+id+'"></div><div class="dl" id="dl_'+id+'"></div><div class="nt" id="nt_'+id+'"></div><div class="stale" id="st_'+id+'" style="display:none"></div></div>';
}
function ghL(txt,span,extra){ return '<div class="gh ghL" style="grid-column:span '+span+'">'+esc(txt)+(extra||'')+'</div>'; }
function gh(txt,span,extra){ return '<div class="gh" style="grid-column:span '+span+'">'+esc(txt)+(extra||'')+'</div>'; }

/* ── Franja de decisiones: renglones VITALES con un CEDIS en cero y traslado posible ── */
function decisiones(){
  var red=S.src.redistribucion, dic=S.dic;
  if(!red||!red.f) return '<div class="lbl"><b>Requieren su decisión</b><span>Fuente de alertas no disponible</span></div>';
  var vit=function(c){ return dic && dic.r && dic.r[c] && dic.r[c].vit===1; };
  var G={};
  red.f.forEach(function(x){ if(!(x.urgente && x.destinoEnCero && (dic ? vit(x.cod) : true))) return;
    var k=x.cod+'|'+x.destino; if(!G[k]) G[k]={ cod:x.cod, renglon:x.renglon, destino:x.destino, consumo:x.consumoDestino||0, mover:0, origenes:[] };
    G[k].mover+=Number(x.mover)||0; if(G[k].origenes.indexOf(x.origen)<0) G[k].origenes.push(x.origen); });
  var L=Object.keys(G).map(function(k){ return G[k]; });
  L.sort(function(a,b){ return b.consumo-a.consumo; }); S.vitales=L;
  var top=L.slice(0,3).map(function(x){
    var nom=String(x.renglon||x.cod).split(',')[0];
    return '<a class="dc" href="#plan" data-go="plan" title="'+esc(x.renglon)+'"><div class="n">Hoy</div><div class="t"><b>'+esc(nom)+'</b><span>'+esc(x.destino)+' en cero · mover '+x.mover.toLocaleString('en-US')+' u desde '+esc(x.origenes.join(' y '))+'</span></div></a>';
  }).join('');
  while((top.match(/class="dc"/g)||[]).length<3) top+='<div></div>';
  return '<div class="lbl"><b>Requieren su decisión</b><span>'+L.length.toLocaleString('en-US')+' casos: renglones vitales en cero en un CEDIS · corte '+esc(fCorta(red.kpi&&red.kpi.corte))+'</span></div>'+top+
    '<a class="all" href="#plan" data-go="plan">Ver todas →</a>';
}

function construir(){
  var hoy=hoyPTY(), mesHoy=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');
  /* Meses del selector: desde el inicio de la medición (registro_fuentes.inicioMedicion) y como
     máximo los últimos 12, así en 2027 la ventana corre sola (oct-26 … sep-27) y el año se
     muestra en la etiqueta cuando la ventana cruza de un año a otro. */
  var meses=[], ini=String(S.reg.inicioMedicion||'2026-05'), cur=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  for(var k=0;k<12;k++){ var dd=new Date(cur.getFullYear(),cur.getMonth()-k,1), mm=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0'); if(mm<ini) break; meses.unshift(mm); }
  if(!meses.length) meses=[mesHoy];
  S.dosAnios = meses[0].substring(0,4)!==meses[meses.length-1].substring(0,4);
  S.meses=meses; S.mesHoy=mesHoy; S.idx=meses.length-1;
  /* Si el mes en curso aún no tiene salidas, el panel abre en el último mes con datos. */
  var k1=valorEn('1a',mesHoy); if(meses.length>1 && k1 && k1.vacio) S.idx=meses.length-2;
  var h='<section class="dec">'+decisiones()+'</section>'+

    /* Una sola rejilla de 6 columnas: todas las tarjetas miden lo mismo en ancho y en alto. */
    '<div class="grid">'+gh(OBJ['01'],5,'<span class="slot" id="slotAcc"><button class="tour" type="button" data-tour="1">▶ Recorrido guiado</button></span>')+ghL('Lectura del mes',1,'<button class="info" type="button" data-leer="1">ⓘ Cómo leer</button>')+
    ORDEN['01'].map(card).join('')+'<div class="lcell"><ul class="lect" id="lect"></ul></div>'+
    gh(OBJ['02'],3)+gh(OBJ['03'],2)+gh(OBJ['04'],1)+
    ORDEN['02'].map(card).join('')+ORDEN['03'].map(card).join('')+ORDEN['04'].map(card).join('')+'</div>'+
    '<div class="src" id="src">'+S.srcHtml+'</div>';
  var md=$('menuDesc'); if(md) md.parentNode.removeChild(md);
  $('main').innerHTML='<div id="v-panel">'+h+'</div><div id="v-alertas" class="vw" hidden></div><div id="v-desp" class="vw" hidden></div><div id="v-ue" class="vw" hidden></div><div id="v-plan" class="vw" hidden></div><div id="v-pres" class="vw" hidden></div>';
  if(md){ md.style.display=''; $('slotAcc').appendChild(md); }
  $('navm').innerHTML='<button class="play" id="bPlay" type="button">▶ Recorrer</button>'+
    meses.map(function(m,i){ return '<button class="mb" type="button" data-i="'+i+'" title="'+mesLabel(m)+'">'+MES[+m.substring(5,7)-1]+(S.dosAnios?' '+m.substring(2,4):'')+'</button>'; }).join('');
  $('navm').addEventListener('click',function(e){
    var b=e.target.closest('.mb'); if(b){ parar(); pintar(+b.getAttribute('data-i')); return; }
    if(e.target.closest('#bPlay')) recorrer();
  });
  Object.keys(S.reg.indicadores).forEach(function(id){

   el supervisor en el Kanban ("F. prometida"); sin ella, el pedido atrasado no tiene fecha. */
var KAN_DET='https://torredecontrolcss.github.io/ASIGNACION_F8/kanban/tablero.json';
function cargarPromesas(){
  if(S.promEstado) return; S.promEstado='cargando';
  cargar(KAN_DET).then(function(j){
    var c=j.cols||[], ix={}; c.forEach(function(k,i){ ix[k]=i; });
    var hoy=new Date().toLocaleString('sv-SE',{timeZone:'America/Panama'}).substring(0,10), P={};
    (j.rows||[]).forEach(function(r){
      if(r[ix.despachado]||r[ix.anulado]) return;
      if(String(r[ix.grupo]||'').toUpperCase().indexOf('LABORATORIO')>=0) return;
      var u=r[ix.ue]||'', fc=String(r[ix.fechaComprometida]||'').substring(0,10), fv=String(r[ix.fechaVencimiento]||'').substring(0,10);
      if(!P[u]) P[u]={ con:0, atrConPromesa:0, prox:'' };
      if(fc){ P[u].con++; if(fc>=hoy && (!P[u].prox || fc<P[u].prox)) P[u].prox=fc; if(fc<hoy) P[u].atrConPromesa++; }
    });
    S.prom=P; S.promEstado='ok';
  }).catch(function(){ S.promEstado='error'; }).then(function(){
    var el=$('v-desp'); if(el && !el.hidden){ el.dataset.mes=''; vista('desp'); }
  });
}
function promTxt(n,venc){
  if(S.promEstado!=='ok') return S.promEstado==='error'?'No disponible':'Consultando…';
  var p=S.prom[n];
  if(p && p.prox) return 'Próxima: '+fCorta(p.prox)+(p.con>1?' ('+p.con+' con fecha)':'');
  if(p && p.con) return p.con+' con fecha ya vencida';
  return venc?'Sin fecha prometida':'—';
}
function brecha(x){ if(x.oa==null||x.ac==null) return ''; return (100-x.oa)>=(100-x.ac)?'Tiempo de salida del almacén':'Producto incompleto (abasto)'; }
function vDesp(){

  var h=cabecera('desp','Despachos','Si se cumplió con los despachos pedidos, a quién no, por qué y cuándo se le cumple.');
  if(!f||!f.salidas){ var pm=mesAnt(mes); h+='<div class="pn"><div class="ph"><h3>'+esc(mesLabel(mes))+'</h3></div><div style="font-size:13px">Sin salidas registradas aún en '+esc(MESL[+mes.substring(5,7)-1])+'. Seleccione '+esc(MESL[+pm.substring(5,7)-1])+' en el panel ejecutivo para ver el cierre del mes anterior.</div></div>'; return h; }
  var g=S.reg.indicadores;
  h+='<div class="kp">'+
    kc(estado(g['1a'],f['1a']),'A tiempo',fmt(f['1a'],'%'),'meta ≥ '+g['1a'].meta+'% · prov.')+
    kc(estado(g['1b'],f['1b']),'Completo',fmt(f['1b'],'%'),'meta ≥ '+g['1b'].meta+'% · prov.')+
    kc(estado(g['9'],f['9']),'Fill rate',fmt(f['9'],'%'),'meta ≥ '+g['9'].meta+'%')+
    kc('con','OTIF (a tiempo y completo)',f.otif!=null?fmt(f.otif,'%'):'—','ambas a la vez')+
    kc('con','Formas 8 despachadas',num(f.salidas),mesLabel(mes))+
    kc(est.vencidos?'bajo':'ok','Formas 8 pendientes hoy',num(est.pendientes),num(est.vencidos)+' atrasadas · '+num(est.vencidosConStock)+' con producto')+'</div>'+
    (S.promEstado==='ok' ? (function(){ var con=0; Object.keys(S.prom).forEach(function(k){ con+=S.prom[k].con; });
      return '<div class="pn" style="flex-direction:row;align-items:center;gap:12px"><b style="font-size:13px;color:#0C447C">Compromisos de entrega</b><span style="font-size:13px">'+
        num(con)+' Formas 8 pendientes tienen fecha prometida en el Kanban; '+num(Math.max(0,(est.vencidos||0)-con))+' atrasadas siguen sin fecha.</span></div>'; })() : '');
  var F=ueFilas(mes).filter(function(r){ return r.x.s>0; });
  F.sort(function(a,b){ return (a.x.o==null?999:a.x.o)-(b.x.o==null?999:b.x.o) || b.x.p-a.x.p; });
  /* Gráficos de rendimiento: estado de lo pendiente, dónde se pierde el cumplimiento y quién acumula atraso */
  var alDia=Math.max(0,(est.pendientes||0)-(est.vencidos||0)), conP=est.vencidosConStock||0, sinP=Math.max(0,(est.vencidos||0)-conP);
  var pierde={alm:0,aba:0}; F.forEach(function(r){ var b=brecha(r.x); if(/almac/i.test(b)) pierde.alm++; else if(b) pierde.aba++; });
  var top=F.slice().filter(function(r){ return r.x.v>0; }).sort(function(a,b){ return b.x.v-a.x.v; }).slice(0,10), mx=top.length?top[0].x.v:1;
  h+='<div class="tri">'+
    dona('Formas 8 pendientes hoy',[{l:'Al día',n:alDia,c:COL.ok[0]},{l:'Atrasadas con producto',n:conP,c:COL.bajo[0]},{l:'Atrasadas sin producto',n:sinP,c:COL.crit[0]}],'Las atrasadas con producto se pueden despachar ya; las sin producto esperan abasto.')+
    dona('Dónde pierden cumplimiento las unidades',[{l:'Tiempo de salida del almacén',n:pierde.alm,c:'#0C447C'},{l:'Producto incompleto (abasto)',n:pierde.aba,c:'#5b8fc7'}],'Unidades con despachos en '+MESL[+mes.substring(5,7)-1]+', según su mayor brecha.')+
    '<div class="pn" style="min-width:0"><div class="ph"><h3>Formas 8 atrasadas por unidad · 10 mayores</h3></div><div class="hb">'+
      top.map(function(r){ return '<div class="r"><span title="'+esc(r.n)+'">'+esc(r.n)+'</span><i style="width:'+Math.max(4,Math.round(100*r.x.v/mx))+'%"></i><b>'+num(r.x.v)+'</b></div>'; }).join('')+
    '</div><div class="nota">Foto de hoy del Kanban.</div></div></div>';
  cargarPromesas();
  var filas=F.map(function(r){ var x=r.x; return [r.n,x.s,x.on,x.ac,x.fr,x.o,brecha(x),x.p,x.v,promTxt(r.n,x.v)]; });
  var pc=function(id){ return function(v){ return v==null?'—':chip(estado(g[id],v),fmt(v,'%')); }; };
  var cols=[{h:'Unidad ejecutora',t:'txt',w:44},{h:'Despachadas (F8)',t:'num',w:12},{h:'A tiempo',t:'dec',w:10,html:pc('1a')},{h:'Completo',t:'dec',w:10,html:pc('1b')},
    {h:'Fill rate',t:'dec',w:10,html:pc('9')},{h:'OTIF',t:'dec',w:9,html:function(v){ return v==null?'—':esc(fmt(v,'%')); }},
    {h:'Dónde pierde más',t:'txt',w:28},{h:'Pendientes (F8)',t:'num',w:12},{h:'Atrasadas (F8)',t:'num',w:12},
    {h:'Cuándo se le cumple',t:'txt',w:24,html:function(v){ return v==='Sin fecha prometida'?'<span style="color:#9b1c1c;font-weight:700">'+esc(v)+'</span>':esc(v); }}];
  h+='<div class="pn"><div class="ph"><h3>A quién no le he cumplido y por qué · '+esc(mesLabel(mes))+' · peor primero</h3><button type="button" data-xls="desp">Excel (todas)</button></div>'+
    tabla('desp',cols,filas)+
    '<div class="nota">Ordenado por OTIF de menor a mayor. "Dónde pierde más" compara cuánto le falta a la salida a tiempo del almacén y cuánto al producto completo. Pendientes y atrasadas son Formas 8 (documentos) en la foto de hoy; "atrasada" es la que pasó su fecha de entrega, no un producto vencido. "Cuándo se le cumple" es la fecha prometida que fija el supervisor en el Kanban (F. prometida); un pedido vencido sin fecha prometida no tiene compromiso de entrega. '+num(filas.length)+' unidades con despachos en el mes.</div></div>';
  return h;
}
/* Unidades ejecutoras: cómo se atiende a cada una, con mapa de calor por provincia */
var UEPROV_URL='ue_provincias.json', COORD_URL='ue_coordenadas.json', POLI_URL='polygons_provincias.js';
function cargarProv(){ if(!S.provP) S.provP=cargar(UEPROV_URL).then(function(j){ S.ueProv=j.ue||{}; }).catch(function(){ S.ueProv={}; }); return S.provP; }
function cargarMapaDatos(){
  if(S.mapaEstado) return S.mapaEstado;
  S.mapaEstado=Promise.all([ lib('leaf').then(function(){ return lib('heat').catch(function(){}); }), cargarProv(),
    cargar(COORD_URL).then(function(j){ S.ueXY=j.ue||{}; }),
    new Promise(function(res){ if(typeof PROVINCIAS_POLIGONOS!=='undefined') return res(); var s=document.createElement('script'); s.src=POLI_URL; s.onload=res; s.onerror=res; document.head.appendChild(s); }) ]);
  return S.mapaEstado;
}
/* Mapa de nivel de servicio: un nodo por unidad ejecutora (coordenadas de Mi Farma Digital),
   coloreado por su fill rate del mes, más un mapa de calor (rojo: lejos de la meta; verde: en meta).
   Clic en el nodo: el detalle de la unidad. Los CEDIS como solicitantes no se dibujan. */
function dibujarMapaUE(){
  var mes=S.meses[S.idx], g9=S.reg.indicadores['9'], g1=S.reg.indicadores['1a'];
  cargarMapaDatos().then(function(){
    var el=$('mapaUE'); if(!el) return;
    if(S.mapa){ S.mapa.remove(); S.mapa=null; }
    el.innerHTML='';
    var L=window.L, m=L.map('mapaUE',{scrollWheelZoom:true}).setView([8.45,-80.1],7); S.mapa=m;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:16,attribution:'© OpenStreetMap'}).addTo(m);
    if(typeof PROVINCIAS_POLIGONOS!=='undefined') PROVINCIAS_POLIGONOS.forEach(function(pp){ L.geoJSON(pp.geometry,{style:{color:'#7a8899',weight:1,fill:false},interactive:false}).addTo(m); });
    var tot=totUE(), F={}; ueFilas(mes).forEach(function(r){ F[r.n]=r.x; }); S.mk={};
    var nombres={}; Object.keys(F).forEach(function(n){ nombres[n]=1; }); Object.keys(tot).forEach(function(n){ nombres[n]=1; });
    var malo=[], bueno=[], pts=[], sinXY=[];
    Object.keys(nombres).forEach(function(n){
      if(/^CEDIS/i.test(n)) return;
      var xy=(S.ueXY||{})[n]; if(!xy){ sinXY.push(n); return; }
      var x=F[n]||{}, fr=(x.s>0 && x.fr!=null)?x.fr:null, st=fr==null?'con':estado(g9,fr), col=COL[st][0];
      if(fr!=null){ if(fr<g9.meta) malo.push([xy.lat,xy.lng,Math.max(0.2,(g9.meta-fr)/g9.meta)]); else bueno.push([xy.lat,xy.lng,Math.max(0.2,Math.min(1,(fr-g9.meta)/(100-g9.meta)+0.3))]); }
      var letra=({'CAPPS':'C','Hospital':'H','Policlínica':'P','ULAPS':'U'}[xy.tipo])||(xy.tipo?xy.tipo.charAt(0).toUpperCase():'•');
      var mk=L.marker([xy.lat,xy.lng],{icon:L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],
        html:'<div style="width:22px;height:22px;border-radius:50%;background:'+col+';border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font:700 11px Segoe UI,Arial">'+letra+'</div>'})}).addTo(m);
      var tt=tot[n]||{}, ult=S.ultEnt?(S.ultEnt[n]||''):'';
      var linea=function(k,v){ return '<tr><td style="color:#4a4a4a;padding:1px 8px 1px 0">'+k+'</td><td style="font-family:Consolas,monospace;text-align:right">'+v+'</td></tr>'; };
      mk.bindPopup('<div style="min-width:230px;font-family:Segoe UI,Arial"><b style="color:#0C447C">'+esc(n)+'</b><br><span style="font-size:11px;color:#666">'+esc(xy.nombre)+' · '+esc((S.ueProv||{})[n]||'')+'</span>'+
        '<table style="font-size:12px;margin-top:6px;border-collapse:collapse">'+
        linea('Fill rate',fr!=null?fmt(fr,'%'):'—')+linea('A tiempo',x.on!=null&&x.s?fmt(x.on,'%'):'—')+
        linea('Despachadas en '+MES[+mes.substring(5,7)-1]+' (F8)',num(x.s||0))+linea('Pendientes hoy (F8)',num(x.p!=null?x.p:(tt.f8||0)))+linea('Atrasadas (F8)',x.v!=null?num(x.v):'—')+
        linea('Confirmó recibido',x.cf!=null?fmt(x.cf,'%'):'—')+linea('Última entrega en bahía',ult?fCorta(ult)+' '+ult.substring(0,4):'—')+'</table>'+
        '<div style="margin-top:6px;font-size:11px">'+chip(st,fr==null?'Sin despachos en el mes':(st==='ok'?'En meta':st==='bajo'?'Cerca de la meta':'Lejos de la meta'))+'</div></div>');
      S.mk[n]=mk; pts.push([xy.lat,xy.lng]);
    });
    if(L.heatLayer){
      if(bueno.length) L.heatLayer(bueno,{radius:34,blur:26,minOpacity:.25,max:1,gradient:{0:'rgba(39,174,96,0)',0.5:'#7dcea0',1:'#1e8449'}}).addTo(m);
      if(malo.length) L.heatLayer(malo,{radius:34,blur:26,minOpacity:.3,max:1,gradient:{0:'rgba(192,57,43,0)',0.4:'#f4d03f',0.7:'#e67e22',1:'#c0392b'}}).addTo(m);

  }).catch(function(e){ var el=$('mapaUE'); if(el) el.innerHTML='<div class="load">'+esc((e&&e.message)||'Mapa no disponible')+'</div>'; });
}
/* Última entrega en bahía por UE: Memoria de entregas del Kanban (entregados.json, ~0.7 MB,
   se baja solo al abrir esta vista). Se excluyen las confirmaciones retroactivas de limpieza
   ("entrega en julio", "LIMPIEZA DE DATOS"…), que llevan la fecha en que se confirmaron y no la
   de la entrega. Cotejado con los Informes de la bahía: 24, 25 y 29-sep iguales; 28-sep +3; 30-sep +1. */
var ENTREG_URL='https://torredecontrolcss.github.io/ASIGNACION_F8/entregados/entregados.json';
var RETRO=/^\s*(entregas?\s+(de\s+|en\s+)?(julio|agosto|septiembre)|limpieza de datos)/i;
function cargarEntregas(){
  if(S.entP) return S.entP;
  S.entP=cargar(ENTREG_URL).then(function(j){ var U={};
    (j.entregados||[]).forEach(function(e){ if(!e.fEntrega || RETRO.test(e.recibio||'')) return; if(!U[e.ue] || e.fEntrega>U[e.ue]) U[e.ue]=e.fEntrega; });
    S.ultEnt=U; }).catch(function(){ S.ultEnt=null; S.entErr=true; });
  return S.entP;
}
/* Filtro desplegable con búsqueda predictiva: clic para ver la lista completa, o escribir para
   acotarla. La lista se arma una vez (nombres en minúsculas precalculados) y solo se filtra. */
function combo(id,opciones,ph){
  S.cb=S.cb||{}; S.cb[id]={ ops:opciones, low:opciones.map(function(o){ return o.toLowerCase(); }), hl:-1 };
  return '<div class="cb" id="cb_'+id+'"><input id="'+id+'" type="text" placeholder="'+esc(ph)+'" autocomplete="off" role="combobox" aria-expanded="false">'+
    '<button type="button" class="cbx" data-cbx="'+id+'" title="Quitar filtro" aria-label="Quitar filtro">×</button><button type="button" class="cbt" data-cbt="'+id+'" aria-label="Abrir lista">▾</button><ul role="listbox"></ul></div>';
}
function comboLista(id,q){
  var C=S.cb[id], box=$('cb_'+id); if(!C||!box) return; q=(q||'').toLowerCase().trim(); var html='', n=0;
  html+='<li data-cbv="" data-cb="'+id+'"><b>Todas las unidades</b></li>';
  for(var i=0;i<C.ops.length && n<200;i++){ var k=C.low[i].indexOf(q); if(q && k<0) continue; n++;
    var o=C.ops[i], txt=q?esc(o.substring(0,k))+'<b>'+esc(o.substring(k,k+q.length))+'</b>'+esc(o.substring(k+q.length)):esc(o);
    html+='<li data-cbv="'+esc(o)+'" data-cb="'+id+'">'+txt+'</li>'; }
  if(!n) html+='<li class="vac">Sin coincidencias</li>';

function comboCerrar(id){ var b=$('cb_'+id); if(b){ b.classList.remove('on'); $(id).setAttribute('aria-expanded','false'); } }
function comboElegir(id,v){ $(id).value=v; comboCerrar(id); if(id==='fUE') filtrarUE(v,true); }
function filtrarUE(v,elegido){ var T=TABLAS.ue; if(!T) return; T.filtro=v; $('tw_ue').innerHTML=htmlTabla('ue');

/* Teléfono: las notas y la franja de fuentes se pliegan para que la lectura empiece por los números.

function plegar(root){
  if(window.innerWidth>640 || !root) return;
  [].slice.call(root.querySelectorAll('div.nota')).forEach(function(n){
    var d=document.createElement('details'); d.className='nota'; d.innerHTML='<summary>Nota</summary>'; while(n.firstChild) d.appendChild(n.firstChild); n.parentNode.replaceChild(d,n); });
  var s=root.querySelector('#src'); if(s && !s.closest('details')){ var d2=document.createElement('details'); d2.className='nota'; d2.innerHTML='<summary>Fuentes y fecha de corte</summary>'; s.parentNode.insertBefore(d2,s); d2.appendChild(s); }

  var x=function(i){ return L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)); }, y=function(v){ return T+(H-T-B)*(1-v/mx); };
  var pts=P.map(function(p,i){ return x(i).toFixed(1)+','+y(p.v).toFixed(1); }).join(' '), ym=y(g.meta).toFixed(1);
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Serie mensual">'+
    [0,50,100].map(function(v){ return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#e3e3e3"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" font-size="9" text-anchor="end" fill="#6a6a6a">'+v+'%</text>'; }).join('')+
    '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ym+'" y2="'+ym+'" stroke="#1c1c1c" stroke-dasharray="4 3"/><text x="'+(W-R)+'" y="'+(ym-4)+'" font-size="10" font-weight="700" text-anchor="end" fill="#1c1c1c">Meta '+g.meta+'%</text>'+

      '<text x="'+x(i)+'" y="'+(y(p.v)-8)+'" font-size="9" text-anchor="middle" fill="#1c1c1c" font-family="Consolas,monospace">'+Math.round(p.v)+'</text>'+
      '<text x="'+x(i)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#3a3a3a">'+esc(p.l)+'</text>'; }).join('')+'</svg>';

/* Dona SVG con leyenda. partes: [{l, n, c}] */
function dona(titulo,partes,nota){

  var arcs=partes.filter(function(p){ return p.n>0; }).map(function(p){ var f=p.n/tot, s='<circle r="'+r+'" cx="60" cy="60" fill="none" stroke="'+p.c+'" stroke-width="22" stroke-dasharray="'+(f*C).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-acc*C).toFixed(2)+'" transform="rotate(-90 60 60)"><title>'+esc(p.l)+': '+p.n+'</title></circle>'; acc+=f; return s; }).join('');
  return '<div class="pn" style="flex:1 1 280px;min-width:0"><div class="ph"><h3>'+esc(titulo)+'</h3></div><div class="cuerpo" style="display:flex;align-items:center;gap:14px;flex:1">'+

function transitoDe(cod,ceros,corte){

  T.rows.forEach(function(x){ if(String(x.cod)!==String(cod)) return;
    var c=String(x.cedis||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); if(ced.indexOf(c)<0) return;
    var u=x.saldo!=null?x.saldo:x.cant; if(!u) return; out.n++;

  return out;
}

    case '1b': return est.vencidosCero ? '**'+num(est.vencidosCero)+' Formas 8 atrasadas esperan producto**: priorizar sus renglones en **compras y traslados**.' : 'Revisar renglones con faltante en los pedidos del mes.';
    case '9': return 'Revisar los renglones con **mayor cantidad no asignada** y su cobertura en los tres CEDIS.';
    case '2': { var n=0, c={}; if(red&&red.f) red.f.forEach(function(x){ if(x.destinoEnCero && /PANAMA/i.test(x.destino) && !c[x.cod]){ c[x.cod]=1; n++; } });
      return (inv&&inv.indicadores['2']?'**'+inv.indicadores['2'].detalle+'**. ':'')+(n?'**'+num(n)+'** de ellos se pueden **surtir hoy desde otro CEDIS** (Planificación).':''); }
    case '3': return 'Cruzar los renglones de **menor cobertura** con las **órdenes de compra en tránsito** (Tránsitos de OC).';
    case '5': { var L=proveedoresBajos(3); return L.length ? 'Gestionar con los proveedores de mayor valor bajo meta: '+L.map(function(x){ return '**'+x.p+'** ('+fmt(x.pct,'%')+')'; }).join(', ')+'.' : 'Revisar los proveedores bajo meta.'; }
    case '6': return 'Separar el tiempo de pedidos mensuales y urgencias para medir contra su meta.';
    case '7': return 'Sostener el ritmo de salidas del almacén.';
    case '8': return rk ? 'Ejecutar los **'+num(rk.urgentes)+' traslados urgentes** entre CEDIS ('+num(rk.unidadesUrgentes)+' unidades).' : 'Ejecutar los traslados urgentes entre CEDIS.';
    case '10': return (inv&&inv.indicadores['10']?'**'+inv.indicadores['10'].detalle+'**: ':'')+'**redistribuir** a unidades con consumo antes de su vencimiento.';
    case '4': return '**Pendiente de los datos de Finanzas** (cifra preliminar del Plan).';
  }
  return '';
}
function vAlertas(){
  var h=cabecera('alertas','Alertas y compromisos','Qué está fuera de meta, qué sugieren los datos y quién responde.');
  var mes=S.meses[S.idx], filas=[], est=(S.src.kanban&&S.src.kanban.estado)||{};
  ['1a','1b','9','2','3','4','5','6','7','8','10'].forEach(function(id){
    var g=S.reg.indicadores[id], x=valorEn(id,mes); if(!x||x.vacio||x.v==null) return;
    var st=estado(g,x.v); if(st==='ok') return;
    var pa=valorEn(id,mesAnt(mes)), dv=(pa&&!pa.vacio&&pa.v!=null&&!(pa.corte&&pa.corte===x.corte))?x.v-pa.v:null;
    filas.push([id+' · '+g.nombre,x.v,(g.dir==='up'?'≥ ':'≤ ')+fmt(g.meta,g.unidad),textoGap(g,x.v).replace(' para llegar a la meta',''),st,accionSugerida(id),g.responsable||'',id,dv]);
  });
  filas.sort(function(a,b){ return (a[4]==='crit'?0:1)-(b[4]==='crit'?0:1); });
  var nR=vitalesRenglones();
  h+='<div class="kp k3">'+kc(filas.length?'crit':'ok','Indicadores fuera de meta',String(filas.length),'en '+MESL[+mes.substring(5,7)-1])+
    '<a href="#plan" data-go="plan" style="text-decoration:none;color:inherit">'+kc(nR?'crit':'ok','Renglones vitales en cero en al menos un CEDIS',num(nR),'con traslado posible hoy · ver Planificación →')+'</a>'+
    kc(est.vencidosConStock?'bajo':'ok','Pedidos atrasados con producto',num(est.vencidosConStock),'Formas 8 que pasaron su fecha de entrega y ya tienen producto')+'</div>';
  var cols=[{h:'Indicador',t:'txt',w:38},{h:'Valor',t:'dec',w:16,html:function(v,r){ var g=S.reg.indicadores[r[7]], d=r[8], tri='';
      if(d!=null && Math.abs(d)>=0.05){ var mejor=g.dir==='up'?d>0:d<0; tri=' <span title="frente al mes anterior" style="font-size:11px;font-weight:700;color:'+(mejor?'#1d5a27':'#9b1c1c')+'">'+(d>0?'▲':'▼')+' '+fmt(Math.abs(d),uGap(g.unidad))+'</span>'; }
      else if(d!=null) tri=' <span style="font-size:11px;color:#6a6a6a">= igual</span>';
      return '<b style="font-family:Consolas,monospace">'+esc(fmt(v,g.unidad))+'</b>'+tri; }},
    {h:'Meta',t:'txt',w:10},{h:'Distancia',t:'txt',w:16,html:function(v,r){ var g=S.reg.indicadores[r[7]]; return '<span style="font-weight:700;color:#9b1c1c">'+(g.dir==='up'?'▲':'▼')+'</span> '+esc(v); }},{h:'Nivel',t:'txt',w:10,html:function(v){ return chip(v,v==='crit'?'Crítico':'Bajo meta'); }},
    {h:'Acción sugerida por los datos',t:'txt',w:70,html:function(v){ return esc(v).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }},{h:'Responsable',t:'txt',w:22,vacio:'Por definir'}];
  h+='<div class="pn"><div class="ph"><h3>Indicadores fuera de meta · '+esc(mesLabel(mes))+'</h3><button type="button" data-xls="ind">Excel</button></div>'+
    tabla('ind',cols,filas.map(function(r){ return r; }))+
    '<div class="nota">La acción sugerida se calcula con los datos del momento de cada fuente. ▲▼ junto al valor: cambio frente al mes anterior (verde mejora, rojo empeora). En Distancia, la flecha indica hacia dónde debe moverse el indicador.</div></div>';
  return h;
}
function exportarTabla(key){
  var T=TABLAS[key]; if(!T) return;
  var nom={ ind:['Indicadores_fuera_de_meta','Indicadores fuera de meta y acción sugerida'], plan:['Vitales_CEDIS_en_cero_planificacion','Vitales con un CEDIS en cero: inventario y cobertura nacional'], desp:['Despachos_por_unidad','Despachos por unidad ejecutora'], ue:['Nivel_servicio_por_unidad','Nivel de servicio por unidad ejecutora'], prov:['Proveedores_recibido','Proveedores: recibido y cumplimiento de entrega'] }[key];
  var filas=T.filas.map(function(r){ return r.slice(0,T.cols.length).map(function(v,i){ var c=T.cols[i]; if(key==='ind'&&i===4) return v==='crit'?'Crítico':'Bajo meta'; if(typeof v==='string') v=v.replace(/\*\*/g,''); return (v===''||v==null)?(c.vacio||''):v; }); });
  xlsInstitucional(nom[0],nom[1],[],T.cols.map(function(c){ return { h:c.h, t:c.t, w:c.w }; }),filas);
}

function tablaHistorica(maxMeses){
  var ids=['1a','1b','9','2','3','4','5','6','7','8','10'], set={};
  ids.forEach(function(id){ var I=S.ind[id]; if(I) Object.keys(I.serie).forEach(function(m){ var f=I.serie[m]; if(f && f.v!=null && !f.vacio) set[m]=1; }); });
  var ms=Object.keys(set).sort(); if(maxMeses && ms.length>maxMeses) ms=ms.slice(ms.length-maxMeses);
  var cols=[{h:'N°',t:'txt',w:6},{h:'Indicador',t:'txt',w:36},{h:'Objetivo',t:'txt',w:10},{h:'Unidad',t:'txt',w:9},{h:'Meta 2026',t:'txt',w:11}]
    .concat(ms.map(function(m){ return {h:mesLabel(m),t:'dec',w:11}; }))
    .concat([{h:'Último corte',t:'txt',w:13},{h:'Fuente',t:'txt',w:34},{h:'Estado de la fuente',t:'txt',w:16}]);
  var filas=ids.map(function(id){
    var g=S.reg.indicadores[id], I=S.ind[id], f=S.reg.fuentes.filter(function(x){ return x.indicadores.indexOf(id)>=0; })[0];
    return [id,g.nombre,g.objetivo,g.unidad,(g.dir==='up'?'≥ ':'≤ ')+g.meta+(g.notaMeta?' (prov.)':'')]
      .concat(ms.map(function(m){ var x=I&&I.serie[m]; return x && x.v!=null && !x.vacio ? x.v : ''; }))
      .concat([I&&I.corte?String(I.corte).substring(0,10):'', f?f.nombre:'', f?estFuente(f):'']);
  });
  return { cols:cols, filas:filas, meses:ms };
}
function logoBin(){ return fetch(LOGO).then(function(r){ return r.arrayBuffer(); }).then(function(b){ var s=''; new Uint8Array(b).forEach(function(x){ s+=String.fromCharCode(x); }); return btoa(s); }).catch(function(){ return null; }); }

function xlsInstitucional(nombre,titulo,meta,cols,filas,frozenX){
  if(!filas.length){ toast('No hay filas que exportar.'); return; }
  toast('Preparando Excel…');
  Promise.all([lib('xls'), logoBin()]).then(function(r){
    var nC=cols.length, ExcelJS=window.ExcelJS, wb=new ExcelJS.Workbook(); wb.creator='Dirección Nacional de Logística';
    var ws=wb.addWorksheet('Reporte',{views:[{state:'frozen',ySplit:7+meta.length,xSplit:frozenX||0}]});
    if(r[1]){ var idI=wb.addImage({base64:r[1],extension:'png'}); ws.addImage(idI,{tl:{col:0,row:0},ext:{width:58,height:58}}); }
    var linea=function(f,txt,o){ ws.mergeCells(f,2,f,Math.max(2,nC)); var c=ws.getCell(f,2); c.value=txt; c.font=Object.assign({name:'Calibri',size:11},o||{}); };
    linea(1,'CAJA DE SEGURO SOCIAL',{bold:true,size:13,color:{argb:'FF0C447C'}});
    linea(2,'Dirección Nacional de Logística · Tablero de Mando de la Dirección',{color:{argb:'FF1E5A9E'}});
    linea(3,titulo,{bold:true,size:12});
    var f=5;
    [['Generado',new Date().toLocaleString('es-PA',{timeZone:'America/Panama'})+' (hora de Panamá)']].concat(meta).forEach(function(kv){
      ws.getCell(f,1).value=kv[0]; ws.getCell(f,1).font={bold:true,size:10,color:{argb:'FF5F6B78'}};
      ws.mergeCells(f,2,f,Math.max(2,nC)); ws.getCell(f,2).value=kv[1]; ws.getCell(f,2).font={size:10}; f++; });
    f++;
    var hr=ws.getRow(f);
    cols.forEach(function(c,i){ var x=hr.getCell(i+1); x.value=c.h; x.font={bold:true,color:{argb:'FFFFFFFF'},size:10};
      x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0C447C'}}; x.alignment={vertical:'middle',horizontal:(c.t||'txt')==='txt'?'left':'right',wrapText:true}; });
    hr.height=30; ws.autoFilter={from:{row:f,column:1},to:{row:f,column:nC}};
    filas.forEach(function(rw,j){ var row=ws.getRow(f+1+j); rw.forEach(function(v,i){ var x=row.getCell(i+1), tp=cols[i].t||'txt';
      x.value=(v===''||v==null)?null:(tp==='txt'?String(v):(isFinite(v)?Number(v):String(v)));
      if(tp==='num') x.numFmt='#,##0'; if(tp==='dec') x.numFmt='0.0#'; x.font={name:tp==='txt'?'Calibri':'Consolas',size:10};
      if(j%2) x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF4F7FB'}}; }); });
    cols.forEach(function(c,i){ ws.getColumn(i+1).width=c.w||14; });
    return wb.xlsx.writeBuffer();
  }).then(function(buf){
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=nombre+'_'+sello().substring(0,10)+'.xlsx'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); toast('Excel descargado.');
  }).catch(function(e){ toast(e.message); });
}
