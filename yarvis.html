<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C447C">
<title>YARVIS · Dirección Nacional de Logística</title>
<link rel="icon" href="https://torredecontrolcss.github.io/REPOSICION_UE_CSS/favicon.ico">
<style>
:root{--az:#0C447C;--az2:#0a3866;--az3:#e8f0f9;--bd:#c9d3df;--tx:#1c1c1c;--tx2:#4a4a4a;--tx3:#6a6a6a;--bg:#eef1f5;--ok:#1d5a27;--warn:#7a4a00;--crit:#9b1c1c;
  --mono:Consolas,"Courier New",monospace;--sans:"Segoe UI",Calibri,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--tx);background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
header{background:var(--az);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0}
header img{width:34px;height:34px}
header .t{flex:1;min-width:0}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
header p{margin:1px 0 0;font-size:11.5px;color:#cfe0f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a,header button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.55);border-radius:3px;padding:6px 10px;font-size:12px;
  font-family:inherit;text-decoration:none;cursor:pointer;white-space:nowrap;min-height:32px}
header a:focus-visible,header button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #f0b429;outline-offset:2px}

/* entrada con PIN */
#entrada{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.caja{background:#fff;border:1px solid var(--bd);max-width:380px;width:100%;padding:22px 20px}
.caja h2{margin:0 0 6px;font-size:17px;color:var(--az)}
.caja p{margin:0 0 14px;font-size:13px;color:var(--tx2);line-height:1.45}
.caja input{width:100%;font-size:22px;letter-spacing:6px;text-align:center;padding:10px;border:1px solid var(--bd);font-family:var(--mono)}
.caja label.rec{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2);margin:10px 0 14px}
.caja button{width:100%;background:var(--az);color:#fff;border:0;padding:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.caja .err{color:var(--crit);font-size:13px;min-height:18px;margin-top:10px}

/* conversación */
#chat{flex:1;display:none;flex-direction:column;min-height:0}
#hilo{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch}
.ancho{max-width:820px;margin:0 auto}
.vacio{padding:6px 2px 4px}
.vacio h2{font-size:17px;margin:4px 0 4px;color:var(--az)}
.vacio p{font-size:13px;color:var(--tx2);margin:0 0 12px;line-height:1.45}
.sug{display:flex;flex-direction:column;gap:6px}
.sug button{text-align:left;background:#fff;border:1px solid var(--bd);border-left:4px solid var(--az);padding:10px 12px;font-size:14px;
  font-family:inherit;color:var(--tx);cursor:pointer;line-height:1.35}
.sug button:hover{background:var(--az3)}
.msg{margin:10px 0;display:flex}
.msg.yo{justify-content:flex-end}
.msg.yo .b{background:var(--az);color:#fff;max-width:85%;padding:9px 12px;font-size:14.5px;line-height:1.4;border-radius:12px 12px 2px 12px;white-space:pre-wrap}
.msg.yv .b{background:#fff;border:1px solid var(--bd);max-width:100%;width:100%;padding:11px 13px;font-size:14.5px;line-height:1.5}
.msg.yv .b p{margin:0 0 8px}.msg.yv .b p:last-child{margin-bottom:0}
.msg.yv .b ul{margin:4px 0 8px;padding-left:20px}.msg.yv .b li{margin:3px 0}
.msg.yv .quien{font-size:11.5px;font-weight:700;color:var(--az);margin-bottom:5px}
.fts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;padding-top:8px;border-top:1px solid #e6eaef}
.fts span{font-size:11.5px;background:var(--az3);color:var(--az2);padding:3px 7px;border-radius:2px}
.fts span.des{background:#fbe0bd;color:var(--warn)}
.aviso{font-size:12px;color:var(--warn);margin-top:6px}
.msg.yv.error .b{border-color:#e4b4b4;background:#fdf2f2;color:var(--crit)}
.pensando{display:flex;gap:5px;padding:4px 0}
.pensando i{width:7px;height:7px;border-radius:50%;background:var(--az);opacity:.3;animation:p 1.1s infinite}
.pensando i:nth-child(2){animation-delay:.18s}.pensando i:nth-child(3){animation-delay:.36s}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pensando i{animation:none;opacity:.6}}

/* barra de escritura */
#barra{flex-shrink:0;background:#fff;border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
#barra .ancho{display:flex;gap:6px;align-items:flex-end}
#q{flex:1;resize:none;border:1px solid var(--bd);padding:9px 10px;font-size:15.5px;font-family:inherit;min-height:42px;max-height:130px;line-height:1.35}
#barra button{flex-shrink:0;min-width:44px;min-height:42px;border:1px solid var(--az);background:#fff;color:var(--az);font-size:18px;cursor:pointer;font-family:inherit}
#barra #env{background:var(--az);color:#fff;font-size:14px;font-weight:700;padding:0 14px}
#barra button[disabled]{opacity:.45;cursor:default}
#mic.on{background:var(--crit);border-color:var(--crit);color:#fff}
.pie{font-size:11px;color:var(--tx3);text-align:center;margin-top:5px}
</style>
</head>
<body>
<header>
  <img src="https://raw.githubusercontent.com/TorredeControlCSS/REPOSICION_UE_CSS/main/icons/icon-192.png" alt="Caja de Seguro Social">
  <div class="t"><h1>YARVIS</h1><p>Asistente de la Dirección Nacional de Logística</p></div>
  <button id="nueva" type="button" hidden>Nueva conversación</button>
  <a href="tablero_mando.html">Tablero</a>
</header>

<section id="entrada" aria-labelledby="tE">
  <div class="caja">
    <h2 id="tE">Entrar a YARVIS</h2>
    <p>Responde con los datos publicados por los sistemas de la Dirección y cita la fuente y el corte de cada cifra. Escriba su PIN.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
    <label class="rec"><input id="rec" type="checkbox"> Recordar en este dispositivo</label>
    <button id="entrar" type="button">Entrar</button>
    <div class="err" id="errE" role="alert"></div>
  </div>
</section>

<section id="chat" aria-label="Conversación con YARVIS">
  <div id="hilo" aria-live="polite"><div class="ancho" id="lista"></div></div>
  <div id="barra"><div class="ancho">
    <button id="mic" type="button" title="Dictar la pregunta" aria-label="Dictar la pregunta" hidden>🎤</button>
    <textarea id="q" rows="1" placeholder="Escriba su pregunta" aria-label="Pregunta"></textarea>
    <button id="env" type="button">Enviar</button>
  </div><div class="pie ancho">YARVIS solo usa los datos publicados del ecosistema; si un dato no existe, lo dice.</div></div>
</section>

<script>
(function(){
'use strict';
var URL_YARVIS='https://script.google.com/macros/s/AKfycbxzVgQdW_oJnN8MEf8J0XoxMAcXOe-9lpbceAu045ZERaOnX_dqr-85XyktKeLSOcn7fA/exec';
var SUGERIDAS=[
  '¿Cuáles son los problemas más graves de hoy y quién responde por cada uno?',
  '¿Cumplimos con los despachos que nos pidieron el mes pasado? ¿A quién no y por qué?',
  '¿Cómo está el abastecimiento de los renglones vitales?',
  '¿Cuánto me falta para llegar a la meta de desabasto?',
  '¿Cómo está el Hospital de Chepo?',
  '¿Cómo estamos en el país con la amlodipina 5 mg?'
];
var $=function(id){ return document.getElementById(id); };
var S={ pin:'', nombre:'', hist:[], ocupado:false };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* Texto de YARVIS → HTML: párrafos, viñetas con guion y **negritas**. Todo se escapa primero. */
function formato(t){
  var lineas=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\n/), h='', enLista=false;
  lineas.forEach(function(l){
    var s=l.trim(), v=s.match(/^[-•*]\s+(.*)$/);
    if(v){ if(!enLista){ h+='<ul>'; enLista=true; } h+='<li>'+v[1]+'</li>'; return; }
    if(enLista){ h+='</ul>'; enLista=false; }
    if(s) h+='<p>'+s+'</p>';
  });
  if(enLista) h+='</ul>';
  return h||'<p>(sin texto)</p>';
}
function abajo(){ var h=$('hilo'); h.scrollTop=h.scrollHeight; }
function agregar(html,cls){ var d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html; $('lista').appendChild(d); abajo(); return d; }
function vacio(){
  var hr=new Date().getHours(), sal=hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches';
  $('lista').innerHTML='<div class="vacio"><h2>'+sal+(S.nombre?', '+esc(S.nombre.split(' ')[0].charAt(0)+S.nombre.split(' ')[0].slice(1).toLowerCase()):'')+'</h2>'+
    '<p>Pregunte por un indicador, una unidad ejecutora o un renglón. Puede seguir preguntando sobre la respuesta anterior.</p>'+
    '<div class="sug">'+SUGERIDAS.map(function(s){ return '<button type="button" data-s="'+esc(s)+'">'+esc(s)+'</button>'; }).join('')+'</div></div>';
  $('nueva').hidden=true;
}
function llamar(cuerpo){
  /* text/plain evita la consulta previa (CORS) que Apps Script no responde */
  return fetch(URL_YARVIS,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo) })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}

/* ── entrada ── */
function entrar(pin,silencioso){
  $('errE').textContent=''; $('entrar').disabled=true; $('entrar').textContent='Verificando…';
  return llamar({ pin:pin, accion:'entrar' }).then(function(j){
    if(!j.ok) throw new Error(j.error||'PIN no válido.');
    S.pin=pin; S.nombre=j.nombre||'';
    try{ if($('rec').checked||silencioso) localStorage.setItem('yv_pin',pin); else localStorage.removeItem('yv_pin'); }catch(e){}
    $('entrada').style.display='none'; $('chat').style.display='flex'; vacio(); $('q').focus();
  }).catch(function(e){
    try{ localStorage.removeItem('yv_pin'); }catch(x){}
    $('entrada').style.display='flex'; $('chat').style.display='none';
    if(!silencioso) $('errE').textContent=/HTTP|fetch|Failed/i.test(e.message)?'No hay conexión con YARVIS. Revise su internet e intente de nuevo.':e.message;
  }).then(function(){ $('entrar').disabled=false; $('entrar').textContent='Entrar'; });
}
$('entrar').addEventListener('click',function(){ var p=$('pin').value.trim(); if(!/^\d{4,8}$/.test(p)){ $('errE').textContent='El PIN tiene de 4 a 8 dígitos.'; return; } entrar(p,false); });
$('pin').addEventListener('keydown',function(e){ if(e.key==='Enter') $('entrar').click(); });

/* ── preguntar ── */
function preguntar(texto){
  texto=String(texto||'').trim(); if(!texto||S.ocupado) return;
  if($('lista').querySelector('.vacio')) $('lista').innerHTML='';
  $('nueva').hidden=false;
  agregar('<div class="b">'+esc(texto)+'</div>','yo');
  var esp=agregar('<div class="b"><div class="quien">YARVIS</div><div class="pensando" aria-label="Consultando"><i></i><i></i><i></i></div></div>','yv');
  S.ocupado=true; $('env').disabled=true; $('q').value=''; ajustar();
  llamar({ pin:S.pin, pregunta:texto, historial:S.hist.slice(-6) }).then(function(j){
    if(!j.ok){ esp.className='msg yv error'; esp.innerHTML='<div class="b">'+esc(j.error||'YARVIS no pudo responder.')+'</div>';
      if(/PIN/i.test(j.error||'')){ try{ localStorage.removeItem('yv_pin'); }catch(e){} } return; }
    var fts=(j.fuentes||[]).map(function(f){ var des=f.estado==='desactualizada';
      return '<span'+(des?' class="des"':'')+'>'+esc(f.nombre)+(f.corte?' · corte '+esc(f.corte):'')+(des?' · desactualizada':'')+'</span>'; }).join('');
    esp.innerHTML='<div class="b"><div class="quien">YARVIS</div>'+formato(j.respuesta)+(j.aviso?'<div class="aviso">'+esc(j.aviso)+'</div>':'')+(fts?'<div class="fts">'+fts+'</div>':'')+'</div>';
    S.hist.push({ p:texto, r:j.respuesta });
  }).catch(function(){
    esp.className='msg yv error'; esp.innerHTML='<div class="b">No hay conexión con YARVIS. Revise su internet y vuelva a enviar la pregunta.</div>';
  }).then(function(){ S.ocupado=false; $('env').disabled=false; abajo(); });
}
$('env').addEventListener('click',function(){ preguntar($('q').value); });
$('q').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); preguntar($('q').value); } });
function ajustar(){ var q=$('q'); q.style.height='auto'; q.style.height=Math.min(130,q.scrollHeight)+'px'; }
$('q').addEventListener('input',ajustar);
$('lista').addEventListener('click',function(e){ var b=e.target.closest('[data-s]'); if(b) preguntar(b.getAttribute('data-s')); });
$('nueva').addEventListener('click',function(){ S.hist=[]; vacio(); $('q').focus(); });

/* ── dictado por voz, si el navegador lo permite ── */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  var rec=new SR(); rec.lang='es-PA'; rec.interimResults=true; rec.continuous=false; var base='';
  $('mic').hidden=false;
  $('mic').addEventListener('click',function(){
    if($('mic').classList.contains('on')){ rec.stop(); return; }
    base=$('q').value?$('q').value+' ':''; try{ rec.start(); $('mic').classList.add('on'); }catch(e){}
  });
  rec.onresult=function(e){ var t=''; for(var i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; $('q').value=base+t; ajustar(); };
  rec.onend=function(){ $('mic').classList.remove('on'); $('q').focus(); };
  rec.onerror=function(){ $('mic').classList.remove('on'); };
}

/* ── arranque: si el PIN quedó recordado, entra solo ── */
var guardado=null; try{ guardado=localStorage.getItem('yv_pin'); }catch(e){}
if(guardado){ $('rec').checked=true; entrar(guardado,true); } else { $('pin').focus(); }
})();
</script>
</body>
</html>
